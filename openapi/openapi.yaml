# The API contract. Every route, request shape, response shape, and
# error code belongs here. Adding a route means updating this file in the
# same commit.

openapi: 3.1.0

info:
  title: CodeComrade API
  version: 1.0.0
  description: >
    Peer code review platform API. Every response, success or failure,
    uses the envelope shape defined in PROJECT_BLUEPRINT §3. Every
    response carries an X-Request-Id header whose value matches the
    requestId in any error body.

# Relative, so the same spec works against local and production.
servers:
  - url: /api/v1

tags:
  - name: Health
    description: Liveness and readiness probes. Public, not rate limited, not request logged.
  - name: Users
    description: Profiles, the signed-in user's own data, and their lists.
  - name: Technologies
    description: The shared technology tag list.
  - name: Submissions
    description: Review requests and their reviews.
  - name: Feed
    description: The public and personalized home feeds.

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: >
        Confirms the process is running. Touches nothing external, so it
        keeps passing even when the database is down.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Confirms the service can reach its database and serve traffic.
        Returns 503 when the database is unreachable.
      security: []
      responses:
        "200":
          description: The service is ready to serve traffic.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Own profile and stats
      description: >
        Returns the signed-in user's local profile. On a user's first
        authenticated request, the local profile is created first (D-12).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in user's profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    patch:
      tags: [Users]
      operationId: updateMe
      summary: Update own profile
      description: >
        Updates the signed-in user's locally owned fields: username, bio,
        and technology stack. Returns the updated profile, the same shape
        as GET /users/me. Subject to the write rate limit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/{username}:
    get:
      tags: [Users]
      operationId: getPublicProfile
      summary: Public profile
      description: >
        Any user's public profile. No authentication needed. The username is
        matched case-insensitively.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's public profile.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me/submissions:
    get:
      tags: [Users]
      operationId: listMySubmissions
      summary: Submissions I have posted
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the signed-in user's submissions, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/me/reviews:
    get:
      tags: [Users]
      operationId: listMyReviews
      summary: Reviews I have written
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the reviews the signed-in user has written, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /users/me/reviews-received:
    get:
      tags: [Users]
      operationId: listReviewsReceived
      summary: Reviews on my submissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the reviews other users wrote on the signed-in user's submissions, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /technologies:
    get:
      tags: [Technologies]
      operationId: listTechnologies
      summary: Technology tag list
      description: All technology tags, alphabetical, for pickers and filters. Public.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on the tag name, for type-to-filter pickers.
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: One page of technology tags.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlFiveMinutes"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechnologyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Post a review request
      description: >
        Creates a submission with its evaluation criteria and technology tags
        in one transaction. The author is always the signed-in user. The
        repository URL must be exactly https://github.com/{owner}/{repo}.
        Criteria are fixed at creation and cannot be edited afterwards. Returns
        the new submission in the same shape as the detail endpoint. Subject to
        the write rate limit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: The new submission.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /submissions/{id}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Submission detail
      description: >
        A submission with its criteria, every review, and its repository
        snapshot when one exists. Public.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: The submission.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Submissions]
      operationId: updateSubmission
      summary: Edit own review request
      description: >
        Replaces the four editable fields of a submission: title, description,
        repository URL and technologies. All four are required. Only the author
        may edit it. Criteria cannot be changed and are not accepted at all,
        because existing ratings point at them. When the repository URL
        changes, the cached repository snapshot is cleared and fetched again
        later. Returns the updated submission in the same shape as the detail
        endpoint. Subject to the write rate limit. Does not use the
        Idempotency-Key header, since replaying an edit changes nothing, and the
        header is ignored.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubmissionRequest"
      responses:
        "200":
          description: The updated submission.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /submissions/{id}/reviews:
    post:
      tags: [Submissions]
      operationId: createReview
      summary: Review a submission
      description: >
        Posts a review and awards the reviewer karma in one transaction. The
        reviewer is always the signed-in user and the karma goes to the
        reviewer, never to the submission's author. A review rates every
        criterion of the submission exactly once, so ratings for a subset, or
        for criteria of another submission, are rejected with 400
        CRITERIA_MISMATCH. The author cannot review their own submission
        (403), and a second review of the same submission by the same person is
        rejected with 409. Returns the stored review and the reviewer's new
        karma total, so a client can update its karma display without another
        request. Subject to the write rate limit.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: The stored review and the reviewer's new karma total.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /feed:
    get:
      tags: [Feed]
      operationId: listFeed
      summary: Public feed
      description: >
        Submissions newest first, with optional search and technology
        filters. Public.
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          required: false
          description: Case-insensitive match against title and description.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: technologies
          in: query
          required: false
          description: >
            Comma-separated technology names. Returns submissions with any of
            them. Names are trimmed, lowercased and de-duplicated, up to 10.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: One page of the feed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlRevalidate"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "304":
          description: Not modified. The If-None-Match value still matches the current feed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /feed/personalized:
    get:
      tags: [Feed]
      operationId: listPersonalizedFeed
      summary: Personalized feed
      description: >
        The most recent 200 submissions by other users, ranked by overlap
        with the signed-in user's technology stack blended with recency.
        A user with no technologies gets recency order. 
        The user's own submissions are excluded; they appear in the
        public feed and in /users/me/submissions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: debug
          in: query
          required: false
          description: Set to 1 for a score breakdown per item. Ignored in production.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: One page of the ranked feed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalizedFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  headers:
    XRequestId:
      description: >
        Correlation id generated by the server for this request. Matches
        the requestId in any error body and the reqId on every log line
        for the request. Any value sent by the client is ignored.
      schema:
        type: string
        format: uuid
    # Every response defaults to Cache-Control: no-store. Only the public
    # routes that reference one of these two opt into caching.
    CacheControlRevalidate:
      description: public, max-age=0, must-revalidate. Stored, but rechecked on every request.
      schema: { type: string }
    CacheControlFiveMinutes:
      description: public, max-age=300. Reusable for five minutes without asking.
      schema: { type: string }
    ETag:
      description: Send back as If-None-Match to get 304 when unchanged.
      schema: { type: string }

  securitySchemes:
    # Clerk session token, sent by the frontend as Authorization: Bearer.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Every code the API can return (D-10). Kept as one enum so clients
    # can switch on it and the drift check has a single list to compare.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_REPO_URL
        - CRITERIA_MISMATCH
        - IDEMPOTENCY_KEY_REUSED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - REQUEST_IN_PROGRESS
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL
        - REQUEST_TIMEOUT
        - SERVICE_UNAVAILABLE

    # PROJECT_BLUEPRINT §3. Produced only by the central error handler. No
    # stack trace, Prisma error text, or internal identifier ever appears.
    ErrorEnvelope:
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message, requestId]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            requestId:
              type: string
              format: uuid

    HealthLiveResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          const: true
        data:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              const: ok

    HealthReadyResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          const: true
        data:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              const: ready

    Technology:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    MeResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          const: true
        data:
          type: object
          # No clerkId, ever (D-08). additionalProperties false makes any
          # extra field a spec violation.
          required: [id, username, bio, karma, createdAt, technologies, stats]
          additionalProperties: false
          properties:
            id: { type: integer }
            username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
            bio: { type: [string, "null"] }
            karma: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
            technologies:
              type: array
              items:
                $ref: "#/components/schemas/Technology"
            stats:
              type: object
              required: [submissions, reviewsGiven, reviewsReceived]
              additionalProperties: false
              properties:
                submissions: { type: integer, minimum: 0 }
                reviewsGiven: { type: integer, minimum: 0 }
                reviewsReceived: { type: integer, minimum: 0 }

    UpdateMeRequest:
      type: object
      # Only these three fields. Anything else, karma, clerkId or id
      # included, is rejected with 400 (D-11).
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          description: Trimmed and lowercased, then must match the pattern. Reserved names are rejected.
          pattern: "^[a-z0-9_]{3,30}$"
        bio:
          type: [string, "null"]
          maxLength: 500
          description: Trimmed. An empty string or null clears it.
        technologies:
          type: array
          maxItems: 20
          description: Replaces the whole stack. Names are trimmed, lowercased and de-duplicated. Unknown names are created.
          items:
            type: string
            minLength: 1
            maxLength: 40

    PublicProfileResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          const: true
        data:
          type: object
          # Deliberately no id and no clerkId. additionalProperties false
          # makes either one a spec violation.
          required: [username, bio, karma, createdAt, technologies, stats]
          additionalProperties: false
          properties:
            username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
            bio: { type: [string, "null"] }
            karma: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
            technologies:
              type: array
              items:
                $ref: "#/components/schemas/Technology"
            stats:
              type: object
              required: [submissions, reviewsGiven, reviewsReceived]
              additionalProperties: false
              properties:
                submissions: { type: integer, minimum: 0 }
                reviewsGiven: { type: integer, minimum: 0 }
                reviewsReceived: { type: integer, minimum: 0 }

    PaginationMeta:
      type: object
      required: [totalItems, currentPage, totalPages, itemsPerPage]
      additionalProperties: false
      properties:
        totalItems: { type: integer, minimum: 0 }
        currentPage: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
        itemsPerPage: { type: integer, minimum: 1 }

    SubmissionSummary:
      type: object
      required: [id, title, githubUrl, createdAt, technologies, reviewCount]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        githubUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        technologies:
          type: array
          items:
            $ref: "#/components/schemas/Technology"
        reviewCount: { type: integer, minimum: 0 }

    ReviewSummary:
      type: object
      required: [id, feedback, createdAt, ratings, submission, reviewer]
      additionalProperties: false
      properties:
        id: { type: integer }
        feedback: { type: string }
        createdAt: { type: string, format: date-time }
        ratings:
          type: array
          items:
            type: object
            required: [criterion, rating]
            additionalProperties: false
            properties:
              criterion: { type: string }
              rating: { type: integer, minimum: 1, maximum: 5 }
        submission:
          type: object
          required: [id, title, author]
          additionalProperties: false
          properties:
            id: { type: integer }
            title: { type: string }
            author: { type: string, description: Username of the submission's author }
        reviewer: { type: string, description: Username of the review's author }

    SubmissionListResponse:
      type: object
      required: [success, data, meta]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ReviewListResponse:
      type: object
      required: [success, data, meta]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReviewSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    TechnologyListResponse:
      type: object
      required: [success, data, meta]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Technology"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CreateSubmissionRequest:
      type: object
      # Only these five fields. Anything else, authorId or karma included, is
      # rejected with 400 (D-11). Text is trimmed before the limits apply.
      additionalProperties: false
      required: [title, description, githubUrl, criteria, technologies]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 2000
        githubUrl:
          type: string
          maxLength: 200
          description: >
            Exactly https://github.com/{owner}/{repo}: the https scheme, the
            host github.com in lowercase, and no trailing slash, port, query,
            fragment or .git suffix. Surrounding whitespace is trimmed. Any
            other shape is rejected with 400 INVALID_REPO_URL.
        criteria:
          type: array
          minItems: 1
          maxItems: 5
          description: >
            What reviewers will rate. Fixed once the submission exists. Labels
            must be unique within the submission, compared case-insensitively.
          items:
            type: object
            required: [label]
            additionalProperties: false
            properties:
              label:
                type: string
                minLength: 2
                maxLength: 60
        technologies:
          type: array
          minItems: 1
          maxItems: 8
          description: >
            Names are trimmed, lowercased and de-duplicated, and the limits
            apply after that. Unknown names are created.
          items:
            type: string
            minLength: 1
            maxLength: 40

    UpdateSubmissionRequest:
      type: object
      # Exactly these four fields, all required, because PUT replaces them.
      # Criteria are absent on purpose: they are locked once ratings point at
      # them, so sending them is rejected like any other unknown field. So are
      # authorId and karma (D-11). Text is trimmed before the limits apply.
      additionalProperties: false
      required: [title, description, githubUrl, technologies]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 2000
        githubUrl:
          type: string
          maxLength: 200
          description: >
            Exactly https://github.com/{owner}/{repo}, with the same rules as
            when posting. Changing it clears the cached repository snapshot.
            Any other shape is rejected with 400 INVALID_REPO_URL.
        technologies:
          type: array
          minItems: 1
          maxItems: 8
          description: >
            Replaces the submission's technologies. Names are trimmed,
            lowercased and de-duplicated, and the limits apply after that.
            Unknown names are created.
          items:
            type: string
            minLength: 1
            maxLength: 40

    SubmissionDetailResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: object
          required: [id, title, description, githubUrl, createdAt, updatedAt, status, author, technologies, criteria, reviewCount, reviews, repository]
          additionalProperties: false
          properties:
            id: { type: integer }
            title: { type: string }
            description: { type: string }
            githubUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            status:
              type: string
              enum: [PENDING, REVIEWED]
              description: Derived from the review count on every read (D-14).
            author:
              type: object
              required: [username, karma]
              additionalProperties: false
              properties:
                username: { type: string }
                karma: { type: integer, minimum: 0 }
            technologies:
              type: array
              items:
                $ref: "#/components/schemas/Technology"
            criteria:
              type: array
              items:
                type: object
                required: [id, label, averageRating]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  label: { type: string }
                  averageRating:
                    type: [number, "null"]
                    minimum: 1
                    maximum: 5
                    description: Mean across all reviews, two decimals. null when unreviewed.
            reviewCount: { type: integer, minimum: 0 }
            reviews:
              type: array
              description: Every review, newest first.
              items:
                type: object
                required: [id, feedback, createdAt, reviewer, ratings]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  feedback: { type: string }
                  createdAt: { type: string, format: date-time }
                  reviewer: { type: string, description: The reviewer's username }
                  ratings:
                    type: array
                    items:
                      type: object
                      required: [criterionId, rating]
                      additionalProperties: false
                      properties:
                        criterionId: { type: integer }
                        rating: { type: integer, minimum: 1, maximum: 5 }
            repository:
              description: GitHub metadata. null until fetched, and possibly permanently.
              oneOf:
                - type: "null"
                - type: object
                  required: [stars, primaryLanguage, lastPushedAt, fetchedAt]
                  additionalProperties: false
                  properties:
                    stars: { type: integer, minimum: 0 }
                    primaryLanguage: { type: [string, "null"] }
                    lastPushedAt: { type: [string, "null"], format: date-time }
                    fetchedAt: { type: string, format: date-time }

    CreateReviewRequest:
      type: object
      # Exactly these two fields. Anything else, reviewerId and karma included,
      # is rejected with 400 (D-11). Feedback is trimmed before the limits apply.
      additionalProperties: false
      required: [feedback, ratings]
      properties:
        feedback:
          type: string
          minLength: 20
          maxLength: 2000
        ratings:
          type: array
          minItems: 1
          maxItems: 5
          description: >
            One entry per criterion of the submission, exactly. A criterion
            cannot appear twice. Ratings that do not match the submission's
            criteria are rejected with 400 CRITERIA_MISMATCH.
          items:
            type: object
            required: [criterionId, rating]
            additionalProperties: false
            properties:
              criterionId: { type: integer, minimum: 1, maximum: 2147483647 }
              rating: { type: integer, minimum: 1, maximum: 5 }

    CreateReviewResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: object
          required: [review, reviewerKarma]
          additionalProperties: false
          properties:
            review:
              type: object
              required: [id, submissionId, feedback, createdAt, reviewer, ratings]
              additionalProperties: false
              properties:
                id: { type: integer }
                submissionId: { type: integer }
                feedback: { type: string }
                createdAt: { type: string, format: date-time }
                reviewer: { type: string, description: The reviewer's username }
                ratings:
                  type: array
                  description: Ordered by criterion id.
                  items:
                    type: object
                    required: [criterionId, rating]
                    additionalProperties: false
                    properties:
                      criterionId: { type: integer }
                      rating: { type: integer, minimum: 1, maximum: 5 }
            reviewerKarma:
              type: integer
              minimum: 0
              description: The reviewer's karma total after this review.

    FeedItem:
      type: object
      required: [id, title, description, githubUrl, createdAt, status, author, technologies, reviewCount]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        githubUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, REVIEWED]
        author:
          type: object
          required: [username, karma]
          additionalProperties: false
          properties:
            username: { type: string }
            karma: { type: integer, minimum: 0 }
        technologies:
          type: array
          items:
            $ref: "#/components/schemas/Technology"
        reviewCount: { type: integer, minimum: 0 }

    FeedResponse:
      type: object
      required: [success, data, meta]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    PersonalizedFeedItem:
      type: object
      required: [id, title, description, githubUrl, createdAt, status, author, technologies, reviewCount, matchedTechnologies]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        githubUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [PENDING, REVIEWED]
        author:
          type: object
          required: [username, karma]
          additionalProperties: false
          properties:
            username: { type: string }
            karma: { type: integer, minimum: 0 }
        technologies:
          type: array
          items:
            $ref: "#/components/schemas/Technology"
        reviewCount: { type: integer, minimum: 0 }
        matchedTechnologies:
          type: array
          description: Tags this submission shares with the signed-in user's stack.
          items: { type: string }
        _score:
          type: object
          description: >
            Present only with ?debug=1 outside production. Never in
            production responses.
          required: [final, tag, recency]
          additionalProperties: false
          properties:
            final: { type: number, minimum: 0, maximum: 1 }
            tag: { type: number, minimum: 0, maximum: 1 }
            recency: { type: number, minimum: 0, maximum: 1 }

    PersonalizedFeedResponse:
      type: object
      required: [success, data, meta]
      additionalProperties: false
      properties:
        success: { const: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/PersonalizedFeedItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

  # Reusable error responses, so every route references the same
  # definition instead of redeclaring the envelope.
  responses:
    InternalError:
      description: Unexpected server error. The message is deliberately generic; the requestId maps to the full details in the logs.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: INTERNAL
              message: Something went wrong
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

    ServiceUnavailable:
      description: >
        The service cannot serve traffic right now. SERVICE_UNAVAILABLE
        when a dependency such as the database is unreachable,
        REQUEST_TIMEOUT when the request exceeded REQUEST_TIMEOUT_MS.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: Service is not ready
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

    Unauthorized:
      description: No valid session. The Authorization header is missing, invalid, or expired.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

    BadRequest:
      description: The request did not match the route's schema, including any unexpected field.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 'query: Unrecognized key: "foo"'
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

    TooManyRequests:
      description: Rate limit exceeded. The RateLimit headers say when the window resets.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    Conflict:
      description: The request conflicts with existing data, such as a username that is already taken or a submission the caller has already reviewed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: CONFLICT
              message: That username is already taken
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

    Forbidden:
      description: The caller is signed in but may not do this, such as editing someone else's submission.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You can only edit your own submissions
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: User not found
              requestId: 3f1c2a9e-8b7d-4e6f-9a1b-2c3d4e5f6a7b

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      description: Above 50 is rejected with 400, never clamped.
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
