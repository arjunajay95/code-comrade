name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  backend:
    name: Backend lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

  npm-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The image is built exactly as Render builds it, from the Dockerfile's
      # own NODE_VERSION, so this check keeps that value equal to .nvmrc.
      - name: Check Dockerfile Node version matches .nvmrc
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(sed -n 's/^ARG NODE_VERSION=//p' backend/Dockerfile | tr -d '[:space:]')"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=backend/Dockerfile::NODE_VERSION is '$actual' but .nvmrc says '$expected'"
            exit 1
          fi

      # Builds the production image without pushing it anywhere. A broken
      # Dockerfile or a missing file fails the pull request here, instead
      # of failing on Render during a release.
      - name: Build backend image
        run: docker build -t codecomrade-api:ci backend

  api-drift:
    name: API contract drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Importing the routes loads env.ts, which refuses to start without
      # these. The values are placeholders: nothing connects to a database
      # or to Clerk during this check. The publishable key is shaped like a
      # real one (pk_test_ followed by a base64 domain) so Clerk's client
      # accepts it at construction.
      - name: Check routes against openapi.yaml
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          ALLOWED_ORIGINS: http://localhost:3000
          # Placeholders, not credentials: this check never contacts Clerk.
          # gitleaks:allow marks each line as a reviewed false positive.
          CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk # gitleaks:allow
          CLERK_SECRET_KEY: sk_test_placeholder # gitleaks:allow
        run: npm run check:drift

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    # A fresh PostgreSQL 16 for every run, the same major version as local
    # and Neon (D-24). It exists only for the duration of this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codecomrade_test
        ports:
          - "5432:5432"
        # The job waits until Postgres accepts connections before any step
        # runs, so the reset never races the database starting up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Migrate-then-test: globalSetup resets the service database and applies
      # every migration before the first test runs. DATABASE_URL is a
      # different placeholder on purpose, since the reset guard refuses to
      # run when the two are equal.
      - name: Run tests with coverage
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/codecomrade_test
          ALLOWED_ORIGINS: http://localhost:3000
          # Placeholders, not credentials. No test calls Clerk yet.
          # gitleaks:allow marks each line as a reviewed false positive.
          CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk # gitleaks:allow
          CLERK_SECRET_KEY: sk_test_placeholder # gitleaks:allow
        run: npm run test:coverage

      # The HTML report, downloadable from the run page, for seeing exactly
      # which lines went untested.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    # Runs only after every check succeeds. If any listed job fails or is
    # cancelled, this job is skipped and nothing deploys.
    needs: [backend, frontend, codeql, npm-audit, gitleaks, docker, api-drift, tests]

    # Only a push to main deploys. Pull requests and pushes to development
    # run every check, but this job is skipped for them.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Two releases merged back to back must not deploy at the same time.
    # The second waits for the first instead of racing it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    # This job only calls two URLs. It needs no access to the repository,
    # so it gets none.
    permissions: {}

    steps:
      - name: Trigger Render deploy
        # Secrets go in through env, never pasted into the command itself,
        # which keeps them out of the shell's command text entirely.
        # --fail-with-body turns an HTTP error from the hook into a failed
        # step instead of a silent success.
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body -sS -X POST "$HOOK_URL"

      - name: Trigger Vercel deploy
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body -sS -X POST "$HOOK_URL"
